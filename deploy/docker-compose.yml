# On the VPS, from the deploy/ folder: docker compose up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data
      - ./releases:/releases:ro
    # Only reachable from the VPS itself (used when nginx is the front server).
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped

  # Started only with COMPOSE_PROFILES=caddy (set by install.sh when nginx is not installed).
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.edgey.shop}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data
    depends_on:
      - api
    restart: unless-stopped
