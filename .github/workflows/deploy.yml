name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 194.163.138.26
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /opt/edgey/deploy && git pull && docker compose up -d --build
